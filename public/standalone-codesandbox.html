    // --- 1. Authentic Satyanaam Audio & Vocal Chanting Engine (Pure Satlok / Sant Mat Tradition) ---
    class SatyanaamAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isPlaying = false;
        this.harpTimer = null;
        this.vocalTimer = null;
        this.vocalEnabled = true;
        this.volume = 0.5;
        this.onStateChange = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBell() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          // 528 Hz Pure Sacred Harmonic Frequency
          osc.frequency.setValueAtTime(528, now);
          osc.frequency.exponentialRampToValueAtTime(264, now + 1.5);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(now);
          osc.stop(now + 1.8);
        } catch (e) {
          console.warn('Bell audio:', e);
        }
      }

      // Three-Stroke Sacred "Sat - Ya - Naam" Manjira Chime
      playSatyanaamTripleChime() {
        try {
          this.init();
          const freqs = [528, 660, 792]; // Pure harmonious Sat-Ya-Naam triad
          freqs.forEach((freq, idx) => {
            setTimeout(() => {
              if (!this.ctx) return;
              const now = this.ctx.currentTime;
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();

              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now);
              osc.frequency.exponentialRampToValueAtTime(freq * 0.98, now + 0.9);

              gain.gain.setValueAtTime(0.2, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

              osc.connect(gain);
              gain.connect(this.masterGain);

              osc.start(now);
              osc.stop(now + 0.95);
            }, idx * 280);
          });
        } catch(e) {}
      }

      playBeadClick() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(now);
          osc.stop(now + 0.16);
        } catch(e) {}
      }

      // Celestial Swarmandal / Santoor Arpeggio Note (D-Major / Bilawal)
      playSwarmandalNote(freq, duration = 2.4, velocity = 0.12) {
        if (!this.ctx || !this.isPlaying) return;
        try {
          const now = this.ctx.currentTime;
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);

          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(freq * 2, now); // Shimmering harmonic

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(velocity, now + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.masterGain);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration);
          osc2.stop(now + duration);
        } catch(e) {}
      }

      // Gentle vocal chant of "सत्यनाम"
      speakSatyanaam() {
        if (!this.vocalEnabled || typeof window === 'undefined' || !('speechSynthesis' in window)) return;
        try {
          const utterance = new SpeechSynthesisUtterance('सत्यनाम');
          utterance.lang = 'hi-IN';
          utterance.rate = 0.75;
          utterance.pitch = 0.95;
          utterance.volume = 0.7;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }

      startAkhandSatyanaam(cb) {
        this.init();
        if (this.isPlaying) return;
        this.isPlaying = true;
        this.onStateChange = cb;
        if (cb) cb(true);

        this.playSatyanaamTripleChime();

        // Swarmandal notes in sacred D-Major Scale
        const scale = [293.66, 369.99, 440.0, 554.37, 587.33, 739.99, 880.0];
        let noteIndex = 0;

        this.harpTimer = setInterval(() => {
          if (!this.isPlaying) return;
          const baseFreq = scale[noteIndex % scale.length];
          this.playSwarmandalNote(baseFreq, 3.2, 0.14);
          noteIndex = (noteIndex + 1 + Math.floor(Math.random() * 2)) % scale.length;
        }, 1800);

        // Vocal Chanting Loop every 6 seconds
        this.speakSatyanaam();
        this.vocalTimer = setInterval(() => {
          if (!this.isPlaying) return;
          this.speakSatyanaam();
        }, 6000);
      }

      stopAkhandSatyanaam(cb) {
        this.isPlaying = false;
        if (this.harpTimer) clearInterval(this.harpTimer);
        if (this.vocalTimer) clearInterval(this.vocalTimer);
        if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        if (cb) cb(false);
        if (this.onStateChange) this.onStateChange(false);
      }

      toggleAkhandSatyanaam(cb) {
        if (this.isPlaying) {
          this.stopAkhandSatyanaam(cb);
        } else {
          this.startAkhandSatyanaam(cb);
        }
      }
    }

                      <span className="text-xs uppercase tracking-widest text-amber-100 font-semibold">अमर लोक नाद</span>
                      <span className="text-3xl sm:text-4xl font-extrabold font-rozha my-1">सत्यनाम</span>
                      <span className="text-xs text-amber-200">साहेब बंदगी साहेब</span>
                      
                      {isAkhandPlaying && (
                        <div className="mt-2 text-xs font-bold px-3 py-1 bg-black/30 rounded-full text-amber-100 animate-pulse">
                          सुमिरन फेरा: #{akhandJaapCount}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="space-y-2">
                    <h3 className="text-lg font-bold font-rozha text-amber-900 dark:text-amber-200">
                      {isAkhandPlaying ? 'अखंड सत्यनाम धुन प्रवाहित हो रही है' : 'सत्यनाम ध्यान प्रारंभ करें'}
                    </h3>
                    <p className="text-xs text-gray-600 dark:text-gray-400 max-w-md mx-auto leading-relaxed">
                      यह धुन पूर्णतः कबीर साहेब की सतलोक परम्परा एवं सत्यनाम ध्वनि पर आधारित है।
                      शांत चित्त से बैठकर श्वास-उच्छ्वास में सत्यनाम का सुमिरन करें।
                    </p>
                  </div>

                  <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                    <button
                      onClick={toggleAkhand}
                      className={`w-full sm:w-auto px-8 py-3.5 rounded-2xl font-bold text-sm shadow-xl transition-all active:scale-95 flex items-center justify-center gap-2 ${
                        isAkhandPlaying 
                          ? 'bg-red-700 hover:bg-red-800 text-white' 
                          : 'bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-700 hover:to-amber-800 text-white'
                      }`}
                    >
                      <span>{isAkhandPlaying ? '⏹️ विश्राम (Stop)' : '▶️ अखंड सत्यनाम प्रारंभ करें'}</span>
                    </button>

                    <button
                      onClick={() => satyanaamAudio.playSatyanaamTripleChime()}
                      className="w-full sm:w-auto px-5 py-3.5 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 border border-amber-600/30 rounded-2xl font-semibold text-xs hover:bg-amber-200 transition-colors"
                    >
                      🔔 सत्यनाम नाद घंटी
                    </button>
                  </div>

                  <div className="border-t border-amber-500/10 pt-4 text-[11px] text-gray-500 dark:text-gray-400 flex items-center justify-around">
                    <span>✨ शुद्ध स्वरमंडल राग</span>
                    <span>🕊️ अखंड सत्यनाम जप</span>
                    <span>🌿 100% सात्विक नाद</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: NITNEM */}
            {activeTab === 'nitnem' && (
              <div className="space-y-6">
                <div className="border-b border-amber-600/20 pb-3">
                  <h2 className="text-2xl font-bold font-rozha text-amber-900 dark:text-amber-200">
                    दैनिक नितनेम पाठ (Daily Nitnem)
                  </h2>
                  <p className="text-xs text-gray-600 dark:text-gray-400">
                    प्रातःकाल एवं सायंकाल की नित्य सेवा, विनती एवं अखंड सत्यनाम पाठ
                  </p>
                </div>

                <div className="grid grid-cols-1 gap-6">
                  {NITNEM_SECTIONS.map((section) => (
                    <div key={section.id} className="bg-white dark:bg-sacred-darkcard rounded-2xl p-6 border border-amber-600/20 shadow-sm space-y-4">
                      <div className="flex flex-wrap items-center justify-between gap-2 border-b border-amber-500/10 pb-3">
                        <div>
                          <span className="text-xs font-semibold text-amber-600 dark:text-amber-400 uppercase tracking-wider">
                            {section.time}
                          </span>
                          <h3 className="text-xl font-bold text-sacred-maroon dark:text-amber-100 font-rozha">
                            {lang === 'pb' ? section.punjabiTitle : section.title}
                          </h3>
                        </div>
                        <button 
                          onClick={() => satyanaamAudio.playBell()}
                          className="px-3 py-1 bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 rounded-full text-xs font-medium hover:bg-amber-200 transition-colors"
                        >
                          🔔 घंटी बजाएं
                        </button>
                      </div>

                      <p className="text-xs text-gray-500 dark:text-gray-400 italic">
                        {section.desc}
                      </p>

                      <div className="bg-sacred-parchment/60 dark:bg-sacred-darkbg/80 rounded-xl p-5 border border-amber-500/10 space-y-2.5">
                        {section.verses.map((verse, vIdx) => (
                          <p key={vIdx} className="text-base sm:text-lg font-medium text-sacred-charcoal dark:text-amber-100 text-center leading-relaxed">
                            {verse}
                          </p>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: VANI & SAKHI */}
            {activeTab === 'vani' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-amber-600/20 pb-3">
                  <div>
                    <h2 className="text-2xl font-bold font-rozha text-amber-900 dark:text-amber-200">
                      कबीर साखी एवं दोहावली
                    </h2>
                    <p className="text-xs text-gray-600 dark:text-gray-400">
                      सत्यनाम, बीजक, साखी संग्रह एवं ग्रंथावली से संकलित अनमोल वचन
                    </p>
                  </div>

                  <div className="relative w-full sm:w-72">
                    <input 
                      type="text" 
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="साखी खोजें (उदा: सत्यनाम, गुरु, माला)..."
                      className="w-full px-4 py-2 pl-9 rounded-xl border border-amber-600/30 bg-white dark:bg-sacred-darkbg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    />
                    <span className="absolute left-3 top-2.5 text-gray-400 text-xs">🔍</span>
                  </div>
                </div>

                {filteredSakhis.length === 0 ? (
                  <div className="text-center py-12 text-gray-500">
                    कोई साखी नहीं मिली। कृपया कोई अन्य शब्द खोजें।
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {filteredSakhis.map(item => (
                      <div key={item.id} className="bg-white dark:bg-sacred-darkcard rounded-2xl p-5 border border-amber-600/20 shadow-sm flex flex-col justify-between space-y-3">
                        <div className="space-y-2">
                          <div className="flex items-center justify-between text-xs">
                            <span className="px-2 py-0.5 rounded bg-amber-100 dark:bg-amber-900/50 text-amber-800 dark:text-amber-200 font-medium">
                              {item.category}
                            </span>
                            <span className="text-gray-400">{item.grantha}</span>
                          </div>

                          <p className="text-base font-bold text-sacred-maroon dark:text-amber-200 whitespace-pre-line leading-relaxed font-tiro">
                            {lang === 'pb' && item.punjabi ? item.punjabi : item.sakhi}
                          </p>

                          <p className="text-xs text-gray-600 dark:text-gray-400 leading-normal">
                            <strong>अर्थ:</strong> {item.meaning}
                          </p>
                        </div>

                        <div className="pt-2 border-t border-amber-500/10 flex justify-end">
                          <button 
                            onClick={() => {
                              navigator.clipboard?.writeText(`${item.sakhi}\n\nअर्थ: ${item.meaning}\n- कबीर वाणी (Saheb World)`);
                              alert('साखी कॉपी कर ली गई है!');
                            }}
                            className="text-xs text-amber-700 dark:text-amber-400 font-semibold hover:underline"
                          >
                            कॉपी करें 📋
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB: JAP MALA */}
            {activeTab === 'mala' && (
              <div className="max-w-md mx-auto text-center space-y-6">
                <div className="space-y-1">
                  <h2 className="text-2xl font-bold font-rozha text-amber-900 dark:text-amber-200">
                    108 मनका दिव्य सत्यनाम माला
                  </h2>
                  <p className="text-xs text-gray-600 dark:text-gray-400">
                    "कर का मनका डारि दे, मन का मनका फेर"
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-white dark:bg-sacred-darkcard p-4 rounded-2xl border border-amber-600/20 shadow-sm">
                    <span className="text-xs text-gray-500 uppercase font-semibold">सत्यनाम मनका</span>
                    <div className="text-3xl font-extrabold text-amber-800 dark:text-amber-300 font-rozha mt-1">
                      {beadCount} <span className="text-sm font-normal text-gray-400">/ 108</span>
                    </div>
                  </div>
                  <div className="bg-white dark:bg-sacred-darkcard p-4 rounded-2xl border border-amber-600/20 shadow-sm">
                    <span className="text-xs text-gray-500 uppercase font-semibold">माला पूर्ण (फेरा)</span>
                    <div className="text-3xl font-extrabold text-sacred-maroon dark:text-amber-400 font-rozha mt-1">
                      {malaRounds}
                    </div>
                  </div>
                </div>

                <div className="py-6 flex flex-col items-center justify-center">
                  <button
                    onClick={handleBeadClick}
                    className="relative w-56 h-56 rounded-full bg-gradient-to-tr from-amber-700 via-amber-600 to-yellow-500 text-white shadow-2xl flex flex-col items-center justify-center border-4 border-amber-300/60 active:scale-95 transition-all select-none group"
                  >
                    <div className="absolute inset-0 rounded-full border-2 border-dashed border-amber-200/50 animate-spin" style={{ animationDuration: '30s' }}></div>
                    
                    <span className="text-xs uppercase tracking-widest text-amber-200 font-bold">।। सत्यनाम ।।</span>
                    <span className="text-2xl font-bold font-rozha my-1">साहेब बंदगी</span>
                    <span className="text-xs text-amber-100 bg-black/20 px-3 py-1 rounded-full">
                      स्पर्श करें (Tap to Bead)
                    </span>
                    <span className="text-4xl font-extrabold mt-2 font-rozha">
                      {beadCount}
                    </span>
                  </button>
                </div>

                <div className="flex items-center justify-center gap-4">
                  <button
                    onClick={() => setSoundEnabled(!soundEnabled)}
                    className="px-4 py-2 rounded-xl bg-white dark:bg-sacred-darkcard text-amber-800 dark:text-amber-300 border border-amber-600/20 text-xs font-semibold shadow-sm"
                  >
                    {soundEnabled ? '🔔 ध्वनि चालू' : '🔕 ध्वनि बंद'}
                  </button>
                  <button
                    onClick={resetMala}
                    className="px-4 py-2 rounded-xl bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 border border-red-300/40 text-xs font-semibold shadow-sm hover:bg-red-100"
                  >
                    पुनः आरंभ (Reset)
                  </button>
                </div>
              </div>
            )}

            {/* TAB: VANI PURIFIER */}
            {activeTab === 'purifier' && (
              <div className="space-y-6 max-w-2xl mx-auto">
                <div className="border-b border-amber-600/20 pb-3">
                  <h2 className="text-2xl font-bold font-rozha text-amber-900 dark:text-amber-200">
                    कबीर वाणी पाठ शुद्धि (Spiritual Purifier)
                  </h2>
                  <p className="text-xs text-gray-600 dark:text-gray-400">
                    साधु भाषा (सधुक्कड़ी बोली) एवं कबीर वाणी के प्रामाणिक शब्दों की वर्तनी शुद्धिकरण
                  </p>
                </div>

                <div className="bg-white dark:bg-sacred-darkcard rounded-2xl p-6 border border-amber-600/20 shadow-sm space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-2">
                      यहाँ वाणी या पद दर्ज करें:
                    </label>
                    <textarea 
                      rows="4" 
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      className="w-full p-3 rounded-xl border border-amber-600/30 bg-sacred-parchment/30 dark:bg-sacred-darkbg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 font-tiro"
                    />
                  </div>

                  <button
                    onClick={runPurifier}
                    className="w-full py-3 bg-gradient-to-r from-amber-700 to-amber-800 hover:from-amber-800 hover:to-amber-900 text-white font-bold rounded-xl shadow-lg transition-transform active:scale-98 text-sm"
                  >
                    ✨ वाणी शुद्धिकरण एवं विश्लेषण करें
                  </button>

                  {purifiedOutput && (
                    <div className="mt-4 pt-4 border-t border-amber-500/20 space-y-3">
                      <div className="bg-green-50 dark:bg-emerald-950/40 border border-green-200 dark:border-emerald-800/40 p-4 rounded-xl">
                        <span className="text-xs font-bold text-green-800 dark:text-green-300 uppercase">
                          ✓ शुद्ध एवं प्रामाणिक स्वरूप:
                        </span>
                        <p className="text-base font-bold text-emerald-900 dark:text-emerald-100 mt-1 font-tiro">
                          {purifiedOutput.result}
                        </p>
                      </div>

                      {purifiedOutput.changes.length > 0 && (
                        <div className="text-xs space-y-1">
                          <span className="font-bold text-gray-600 dark:text-gray-400">सुधार विवरण:</span>
                          <ul className="list-disc list-inside text-gray-600 dark:text-gray-400">
                            {purifiedOutput.changes.map((ch, idx) => (
                              <li key={idx}>
                                <strong>'{ch.wrong}'</strong> के स्थान पर <strong>'{ch.correct}'</strong> ({ch.note})
                              </li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: QR CODE & SHARE */}
            {activeTab === 'share' && (
              <div className="max-w-md mx-auto text-center space-y-6">
                <div className="space-y-1">
                  <h2 className="text-2xl font-bold font-rozha text-amber-900 dark:text-amber-200">
                    ऐप क्यूआर कोड एवं शेयर
                  </h2>
                  <p className="text-xs text-gray-600 dark:text-gray-400">
                    सतगुरु कबीर साहेब की वाणी व अखंड सत्यनाम को अन्य भक्तों के साथ साझा करें
                  </p>
                </div>

                <div className="bg-white dark:bg-sacred-darkcard p-6 rounded-3xl border-2 border-amber-500/30 shadow-xl space-y-4">
                  <div className="flex justify-center">
                    <SacredQRCode size={180} />
                  </div>

                  <div>
                    <h3 className="font-bold font-rozha text-amber-900 dark:text-amber-200 text-lg">
                      Saheb World
                    </h3>
                    <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">
                      दूसरे फोन से इस QR कोड को स्कैन करके सीधे ऐप खोलें व इंस्टॉल करें।
                    </p>
                  </div>

                  <div className="pt-2 flex flex-col gap-2">
                    <button
                      onClick={() => {
                        const shareUrl = window.location.href;
                        if (navigator.share) {
                          navigator.share({
                            title: 'Saheb World - अखंड सत्यनाम एवं कबीर साहेब स्वाध्याय',
                            text: '।। सत्यनाम ।। कबीर साहेब वाणी, नितनेम एवं अखंड सत्यनाम सुमिरन ऐप:',
                            url: shareUrl
                          });
                        } else {
                          navigator.clipboard?.writeText(shareUrl);
                          alert('ऐप लिंक कॉपी हो गया!');
                        }
                      }}
                      className="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow text-sm transition-colors"
                    >
                      🔗 लिंक शेयर / कॉपी करें
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="mt-auto border-t border-amber-600/20 bg-sacred-parchment dark:bg-sacred-darkcard/60 py-6 text-center text-xs text-amber-900/70 dark:text-amber-300/70 space-y-2">
            <div className="font-rozha text-sm font-semibold text-amber-800 dark:text-amber-300">
              ।। सत्यनाम साहेब कबीर ।। साहेब बंदगी साहेब ।।
            </div>
            <p>
              सृष्टि रचना से कलियुग तक, पूर्ण परब्रह्म सतगुरु कबीर साहेब के चरणों में सादर नमन।
            </p>
            <p className="text-[10px] text-gray-500">
              Saheb World Spiritual Swadhyay • अखंड सत्यनाम संस्करण
            </p>
          </footer>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
